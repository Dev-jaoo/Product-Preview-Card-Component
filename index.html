<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
    <title>Frontend Mentor | Product preview card component</title>
</head>

<body>

    <div class="container">
        <main class="product">
            <div class="product_img">
                <picture>
                    <source media="(max-width: 700px)" srcset="./assets/images/image-product-mobile.jpg">
                    <img src="./assets/images/image-product-desktop.jpg" alt="Gabrielle Chanel perfume bottle">
                </picture>
            </div>
            <div class="product_about">
                <p class="product_name">Perfume</p>
                <h1>
                    Gabrielle Essence Eau De Parfum
                </h1>
                <p class="product_text">
                    A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.
                </p>
                <div class="product_price">
                    <span class="product_price-discount">$149.99</span>
                    <span class="product_price-cost">$169.99</span>
                </div>
                <button>
                    <img src="./assets/images/icon-cart.svg" alt="add to cart">
                    Add to Cart
                </button>

            </div>
        </main>
    </div>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="https://github.com/Dev-jaoo/Product-Preview-Card-Component" target="_blank">João</a>.
    </footer>
</body>

</html>
